<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Season}} week {{.Week}}</title>
<style>
  body {
    font: 16px/1.5 system-ui, sans-serif;
    margin: 0 auto;
    max-width: 48rem;
    padding: 1rem;
  }

  /* Two tracks of 1fr: both columns are the same width whatever they hold, so
     neither column's contents can change the other's. One row for the heading,
     then one per starter: 9 is the league's starter count
     (lineup.starterCount), and a subgrid cannot create implicit tracks, so the
     parent must declare them all. */
  .matchup {
    column-gap: 1rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto repeat(9, auto);
  }

  /* One class for both columns. There is deliberately no rule keyed on which
     total is larger: no leader highlight, no bar, no colour that could tell
     the reader a game in progress is a game decided. */
  .column {
    border: 1px solid #ccc;
    border-radius: 6px;
    display: grid;
    grid-row: 1 / -1;
    grid-template-rows: subgrid;
    padding: 0 1rem 0.5rem;
  }

  /* The band's negative inline margin must equal the card's inline padding at
     every width (1rem here, 0.5rem under 33rem), so it reaches the card border
     while the card's padding stays the one inset for starter rows. Its corners
     get the card's inner radius rather than the card using overflow: hidden,
     which would also silently clip a long team name. */
  .column header {
    align-items: baseline;
    background: #f3f3f3;
    border-bottom: 1px solid #ccc;
    border-radius: 5px 5px 0 0;
    column-gap: 0.5rem;
    container-type: inline-size;
    display: grid;
    grid-row: 1;
    grid-template-columns: minmax(0, 1fr) auto;
    margin-inline: -1rem;
    padding: 0.5rem 1rem;
  }

  .column h2 {
    font-size: 1.125rem;
    letter-spacing: 0.04em;
    margin: 0;
    overflow-wrap: break-word;
    text-transform: uppercase;
  }

  .column ol {
    display: grid;
    grid-row: 2 / span 9;
    grid-template-rows: subgrid;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .column li {
    column-gap: 1rem;
    container-type: inline-size;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    padding-block: 0.25rem;
  }

  .column li + li {
    border-top: 1px solid #eee;
  }

  /* A flex item is otherwise at least as wide as its longest word, and would
     push the points box out of the card. A name that does not fit wraps under
     itself rather than being cut off with an ellipsis. */
  .player {
    min-width: 0;
    overflow-wrap: break-word;
  }

  .player .short {
    display: none;
  }

  .meta {
    color: #666;
    font-size: 0.8125rem;
    grid-column: 1;
  }

  /* A box that never gives way to a name, so every row's name gets the same
     width and the points share one right edge. 5ch holds 112.5, the widest
     realistic value, and a negative like -2.5; it is a minimum, so a rarer
     -12.5 widens the box instead of overflowing it. */
  .points {
    font-variant-numeric: tabular-nums;
    min-width: 5ch;
    text-align: right;
    white-space: nowrap;
  }

  .total {
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    margin: 0;
    white-space: nowrap;
  }

  /* 33rem is where the normal spacing stops leaving room for the longest long
     name; above it the page keeps its roomier spacing. */
  @media (max-width: 33rem) {
    body {
      padding: 0.5rem;
    }

    .matchup {
      column-gap: 0.5rem;
    }

    .column {
      padding: 0 0.5rem 0.5rem;
    }

    .column header {
      margin-inline: -0.5rem;
      padding-inline: 0.5rem;
    }

    .column li {
      column-gap: 0.5rem;
    }
  }

  /* The longest long name, with the row gap and the points box beside it,
     needs about 193px of card content; 12.5rem leaves a little slack for font
     differences. The arithmetic is in the fit-matchup-page-to-phone-width
     design.md, decision 3. */
  @container (max-width: 12.5rem) {
    .player .long {
      display: none;
    }

    .player .short {
      display: inline;
    }

    .total {
      font-size: 1.25rem;
    }
  }
</style>
<main class="matchup">
  {{range .Columns}}
  <section class="column">
    <header>
      <h2>{{.Team}}</h2>
      <p class="total">{{.Total}}</p>
    </header>
    <ol>
      {{range .Starters}}<li><span class="player"><span class="long">{{.Name}}</span><span class="short">{{.ShortName}}</span></span><span class="points">{{.Points}}</span><span class="meta">{{.Position}} · {{.Team}}</span></li>{{end}}
    </ol>
  </section>
  {{end}}
</main>
<p class="as-of">Sleeper stats fetched <time datetime="{{.FetchedAtRFC3339}}">{{.FetchedAtText}}</time></p>
<script>
  // How often a page left open during a game re-fetches its scores.
  var refreshInterval = 5 * 60 * 1000;
  var loadedAt = Date.now();

  // Checked when the timer fires rather than by stopping and restarting it:
  // a tab left open in the background must not turn into Sleeper volume.
  setInterval(function () {
    if (document.visibilityState === "visible") {
      location.reload();
    }
  }, refreshInterval);

  // A glance away and back must not cost a fetch; only a page already older
  // than the interval is worth reloading on return.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - loadedAt >= refreshInterval) {
      location.reload();
    }
  });
</script>
